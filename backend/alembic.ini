# Cloud-0.1.1-A -- Alembic configuration (Cloud PostgreSQL schema evolution).
#
# Kept ASCII-only on purpose: Alembic reads this file via configparser with
# locale encoding, so non-ASCII comments break on non-UTF-8 locales (Windows).
# The rationale lives in alembic/env.py instead.
#
# URL is NOT hardcoded here: alembic/env.py resolves, in order,
#   1. environment variable DATABASE_URL (docker-compose.cloud.yml uses it), then
#   2. this file's sqlalchemy.url (for explicit local runs).
#
# Division of responsibility (A8):
#   - Cloud PostgreSQL: schema managed by `alembic upgrade head`;
#   - OSS / local SQLite: app.persistence.database.init_database() sqlite-only
#     create_all (development convenience).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
